version: 2
updates:
  - package-ecosystem: npm # pnpm-lock.yaml も更新される
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Nuxt 本体・公式／周辺モジュールは同時に上げないと噛み合わないことがあるのでまとめる
      nuxt:
        patterns:
          - nuxt
          - "@nuxt/*"
          - "@nuxtjs/*"
          - nuxt-*
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Node のメジャーは .mise.toml / netlify.toml と揃えて手動で上げる
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
